---
- name: Render Grafana Ingress template
  ansible.builtin.template:
    src: ingress.yaml.j2
    dest: /tmp/grafana-ingress.yaml
    mode: '0644'
  register: grafana_ingress_template
  changed_when: true

- name: Apply Grafana Ingress
  ansible.builtin.shell: |
    kubectl apply -f /tmp/grafana-ingress.yaml
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  become: false
  register: grafana_ingress_apply
  changed_when: "'created' in grafana_ingress_apply.stdout or 'configured' in grafana_ingress_apply.stdout"

- name: Verify Grafana Ingress exists
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - ingress
      - grafana-ingress
      - --namespace
      - "{{ grafana_namespace }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  become: false
  register: grafana_ingress_verify
  changed_when: false
  failed_when: grafana_ingress_verify.rc != 0

- name: Assert Grafana Ingress verification succeeded
  ansible.builtin.assert:
    that:
      - grafana_ingress_verify.rc == 0
    fail_msg: "Grafana Ingress verification failed."
    success_msg: "Grafana Ingress verified successfully."
