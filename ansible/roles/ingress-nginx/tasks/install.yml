---
- name: Verify operating system support
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_release in ingress_nginx_supported_releases
    fail_msg: "This role supports Ubuntu Jammy, Noble, and Resolute only."
    success_msg: "Operating system support validated for Ubuntu."

- name: Configure Ingress NGINX
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  block:
    - name: Add the ingress-nginx Helm repository
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - add
          - "{{ ingress_nginx_chart_repo_name }}"
          - "{{ ingress_nginx_chart_repo_url }}"
      register: ingress_nginx_repo_add
      changed_when: "'already exists' not in (ingress_nginx_repo_add.stderr | default(''))"
      failed_when: false

    - name: Update Helm repositories
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - update
      register: ingress_nginx_repo_update
      changed_when: false
      failed_when: ingress_nginx_repo_update.rc != 0

    - name: Install or upgrade ingress-nginx
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - "{{ ingress_nginx_release_name }}"
          - "{{ ingress_nginx_chart_repo_name }}/{{ ingress_nginx_chart_name }}"
          - --namespace
          - "{{ ingress_nginx_namespace }}"
          - --create-namespace
          - --version
          - "{{ ingress_nginx_chart_version }}"
          - --set
          - controller.service.type=NodePort
          - --set
          - controller.hostPort.enabled=true
          - --set
          - controller.hostPort.ports.http=80
          - --set
          - controller.hostPort.ports.https=443
      register: ingress_nginx_install
      changed_when: >-
        'STATUS: deployed' in (ingress_nginx_install.stdout | default('')) or
        'STATUS: upgraded' in (ingress_nginx_install.stdout | default(''))
      failed_when: ingress_nginx_install.rc != 0
