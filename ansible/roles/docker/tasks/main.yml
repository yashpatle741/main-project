---
- name: Verify operating system support
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_release in _docker_supported_releases
    fail_msg: "This role supports Ubuntu Jammy, Noble and Resolute only."
    success_msg: "Operating system support validated for Ubuntu noble."

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name: "{{ docker_prerequisite_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure the Docker apt keyring directory exists
  ansible.builtin.file:
    path: "{{ docker_apt_keyring_dir }}"
    state: directory
    mode: "{{ docker_keyring_dir_mode }}"
    owner: root
    group: root

# Download the official Docker repository signing key into the system keyring directory.
- name: Download the official Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: "{{ docker_apt_key_path }}"
    mode: "{{ docker_apt_key_mode }}"
    owner: root
    group: root

# Add the Docker repository so the packages can be installed from the official source.
- name: Add the official Docker apt repository
  ansible.builtin.apt_repository:
    repo: "{{ _docker_repo_line }}"
    filename: "{{ docker_repo_filename }}"
    state: present
    update_cache: true

# Install the container runtime, CLI, and Docker plugins in a repeatable way.
- name: Install Docker engine and plugins
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: "{{ docker_package_state }}"
    update_cache: true
    cache_valid_time: 3600
  notify:
    - Restart Docker

- name: Ensure the Docker group exists
  ansible.builtin.group:
    name: "{{ _docker_group_name }}"
    state: present

# Grant Docker access to the users explicitly defined in the role defaults.
- name: Add configured users to the Docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ _docker_group_name }}"
    append: true
    state: present
  loop: "{{ docker_users }}"
  when: docker_users | length > 0
  loop_control:
    label: "{{ item }}"

# Force a fresh SSH session so the new group membership is picked up immediately.
- name: Reset SSH connection after Docker group changes
  ansible.builtin.meta: reset_connection

- name: Enable and start the Docker service
  ansible.builtin.service:
    name: "{{ docker_service_name }}"
    state: started
    enabled: true

# Verify the Docker CLI and Compose plugin are present and runnable.
- name: Verify Docker CLI installation
  ansible.builtin.command:
    argv:
      - docker
      - --version
  register: docker_version_check
  changed_when: false
  failed_when: false

- name: Verify Docker Compose plugin
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - version
  register: docker_compose_check
  changed_when: false
  failed_when: false

# Fail the play if the core Docker verification commands do not succeed.
- name: Assert Docker verification succeeded
  ansible.builtin.assert:
    that:
      - docker_version_check.rc == 0
      - docker_compose_check.rc == 0
    fail_msg: "Docker installation verification failed. Docker CLI or Compose plugin is not working correctly."
    success_msg: "Docker installation verified successfully."
