---
- name: Verify operating system support
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_release in _docker_supported_releases
    fail_msg: "This role supports Ubuntu Jammy, Noble and Resolute only."
    success_msg: "Operating system support validated for Ubuntu."

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name: "{{ docker_prerequisite_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure the Docker apt keyring directory exists
  ansible.builtin.file:
    path: "{{ docker_apt_keyring_dir }}"
    state: directory
    mode: "{{ docker_keyring_dir_mode }}"
    owner: root
    group: root

- name: Download the official Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: "{{ docker_apt_key_path }}"
    mode: "{{ docker_apt_key_mode }}"
    owner: root
    group: root

- name: Add the official Docker apt repository
  ansible.builtin.apt_repository:
    repo: "{{ _docker_repo_line }}"
    filename: "{{ docker_repo_filename }}"
    state: present
    update_cache: true

- name: Install Docker engine and plugins
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: "{{ docker_package_state }}"
    update_cache: true
    cache_valid_time: 3600
  notify:
    - Restart Docker

- name: Ensure the Docker group exists
  ansible.builtin.group:
    name: "{{ _docker_group_name }}"
    state: present

- name: Add configured users to the Docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ _docker_group_name }}"
    append: true
    state: present
  loop: "{{ docker_users }}"
  when: docker_users | length > 0
  loop_control:
    label: "{{ item }}"

- name: Reset SSH connection after Docker group changes
  ansible.builtin.meta: reset_connection

- name: Enable and start the Docker service
  ansible.builtin.service:
    name: "{{ docker_service_name }}"
    state: started
    enabled: true
