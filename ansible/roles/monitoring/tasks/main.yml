---
- name: Gather system facts
  ansible.builtin.setup:

- name: Verify operating system support
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_release in monitoring_supported_releases
    fail_msg: "This role supports Ubuntu Jammy, Noble, and Resolute only."
    success_msg: "Operating system support validated for Ubuntu."

- name: Configure monitoring resources with kubectl and Helm
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  block:

    - name: Ensure the monitoring namespace exists
      ansible.builtin.shell: |
        kubectl create namespace {{ monitoring_namespace }} --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      changed_when: false

    - name: Add the Prometheus Community Helm repository
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - add
          - "{{ monitoring_chart_repo_name }}"
          - "{{ monitoring_chart_repo_url }}"
      register: monitoring_repo_add
      changed_when: "'already exists' not in (monitoring_repo_add.stderr | default(''))"
      failed_when: false

    - name: Update Helm repositories
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - update
      register: monitoring_repo_update
      changed_when: false

    - name: Install or upgrade kube-prometheus-stack
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - "{{ monitoring_release_name }}"
          - "{{ monitoring_chart_repo_name }}/{{ monitoring_chart_name }}"
          - --namespace
          - "{{ monitoring_namespace }}"
          - --create-namespace
          - --version
          - "{{ monitoring_chart_version }}"
      register: monitoring_install
      changed_when: "'STATUS: deployed' in (monitoring_install.stdout | default('')) or 'STATUS: upgraded' in (monitoring_install.stdout | default(''))"
      failed_when: monitoring_install.rc != 0

    - name: Wait for monitoring pods to be Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --namespace
          - "{{ monitoring_namespace }}"
          - --for=condition=Ready
          - pod
          - --all
          - "--timeout={{ monitoring_wait_timeout }}s"
      register: monitoring_wait
      changed_when: false
      failed_when: monitoring_wait.rc != 0

    - name: Verify monitoring installation
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - --namespace
          - "{{ monitoring_namespace }}"
      register: monitoring_pods_check
      changed_when: false
      failed_when: false

    - name: Assert monitoring verification succeeded
      ansible.builtin.assert:
        that:
          - monitoring_pods_check.rc == 0
        fail_msg: "Monitoring installation verification failed."
        success_msg: "Monitoring installation verified successfully."