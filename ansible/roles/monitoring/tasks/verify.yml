---
- name: Wait for monitoring pods to be Ready
  ansible.builtin.command:
    argv:
      - kubectl
      - wait
      - --namespace
      - "{{ monitoring_namespace }}"
      - --for=condition=Ready
      - pod
      - --all
      - "--timeout={{ monitoring_wait_timeout }}s"
  register: monitoring_wait
  changed_when: false
  failed_when: monitoring_wait.rc != 0

- name: Verify monitoring installation
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pods
      - --namespace
      - "{{ monitoring_namespace }}"
  register: monitoring_pods_check
  changed_when: false
  failed_when: monitoring_pods_check.rc != 0

- name: Assert monitoring verification succeeded
  ansible.builtin.assert:
    that:
      - monitoring_pods_check.rc == 0
    fail_msg: "Monitoring installation verification failed."
    success_msg: "Monitoring installation verified successfully."
