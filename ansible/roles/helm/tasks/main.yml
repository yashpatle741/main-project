---
- name: Gather system facts
  ansible.builtin.setup:

- name: Verify operating system support
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_release in helm_supported_releases
    fail_msg: "This role supports Ubuntu Jammy, Noble, and Resolute only."
    success_msg: "Operating system support validated for Ubuntu."

- name: Ensure the download directory exists
  ansible.builtin.file:
    path: "{{ helm_download_dir }}"
    state: directory
    mode: "0755"

- name: Ensure the install directory exists
  ansible.builtin.file:
    path: "{{ helm_install_dir }}"
    state: directory
    mode: "0755"

- name: Check whether Helm is already installed
  ansible.builtin.stat:
    path: "{{ helm_binary_path }}"
  register: helm_binary_stat

- name: Read the installed Helm version if present
  ansible.builtin.command:
    argv:
      - "{{ helm_binary_path }}"
      - version
      - --short
  register: helm_current_version_check
  changed_when: false
  failed_when: false
  when: helm_binary_stat.stat.exists

- name: Determine whether Helm needs installation
  ansible.builtin.set_fact:
    helm_install_required: >-
      {{ not helm_binary_stat.stat.exists or
      (helm_current_version_check.stdout | default('')) is not search(helm_version | regex_replace('^v', '')) }}

- name: Download the Helm archive
  ansible.builtin.get_url:
    url: "{{ helm_archive_url }}"
    dest: "{{ helm_archive_path }}"
    mode: "0644"
  when: helm_install_required

- name: Ensure the extraction directory exists
  ansible.builtin.file:
    path: "{{ helm_extract_dir }}"
    state: directory
    mode: "0755"
  when: helm_install_required

- name: Extract the Helm archive
  ansible.builtin.unarchive:
    src: "{{ helm_archive_path }}"
    dest: "{{ helm_extract_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
  when: helm_install_required

- name: Install the Helm binary
  ansible.builtin.command:
    cmd: install -m 0755 {{ helm_extract_dir }}/helm {{ helm_binary_path }}
  when: helm_install_required
  
- name: Verify Helm installation
  ansible.builtin.command:
    argv:
      - "{{ helm_binary_path }}"
      - version
      - --short
  register: helm_verification
  changed_when: false
  failed_when: false

- name: Assert Helm verification succeeded
  ansible.builtin.assert:
    that:
      - helm_verification.rc == 0
    fail_msg: "Helm installation verification failed."
    success_msg: "Helm installation verified successfully."
