---
- name: Render ArgoCD Ingress template
  ansible.builtin.template:
    src: ingress.yaml.j2
    dest: /tmp/argocd-ingress.yaml
    mode: '0644'
  register: argocd_ingress_template
  changed_when: true

- name: Apply ArgoCD Ingress
  ansible.builtin.shell: |
    kubectl apply -f /tmp/argocd-ingress.yaml
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  become: false
  register: argocd_ingress_apply
  changed_when: "'created' in argocd_ingress_apply.stdout or 'configured' in argocd_ingress_apply.stdout"

- name: Verify ArgoCD Ingress exists
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - ingress
      - argocd-ingress
      - --namespace
      - "{{ argocd_namespace }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  become: false
  register: argocd_ingress_verify
  changed_when: false
  failed_when: argocd_ingress_verify.rc != 0

- name: Assert ArgoCD Ingress verification succeeded
  ansible.builtin.assert:
    that:
      - argocd_ingress_verify.rc == 0
    fail_msg: "ArgoCD Ingress verification failed."
    success_msg: "ArgoCD Ingress verified successfully."
