---
- name: Gather system facts
  ansible.builtin.setup:

- name: Verify operating system support
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_release in argocd_supported_releases
    fail_msg: "This role supports Ubuntu Jammy, Noble, and Resolute only."
    success_msg: "Operating system support validated for Ubuntu."

- name: Kubernetes operations
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  block:

    - name: Ensure ArgoCD namespace exists
      ansible.builtin.shell: |
        kubectl create namespace {{ argocd_namespace }} --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      changed_when: false

    - name: Add the official Argo Helm repository
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - add
          - "{{ argocd_chart_repo_name }}"
          - "{{ argocd_chart_repo_url }}"
      register: argocd_repo_add
      changed_when: "'already exists' not in (argocd_repo_add.stderr | default(''))"
      failed_when: false

    - name: Update Helm repositories
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - update
      changed_when: false

    - name: Install or upgrade ArgoCD
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - "{{ argocd_release_name }}"
          - "{{ argocd_chart_repo_name }}/{{ argocd_chart_name }}"
          - --namespace
          - "{{ argocd_namespace }}"
          - --create-namespace
          - --version
          - "{{ argocd_chart_version }}"
      register: argocd_install
      changed_when: >
        'STATUS: deployed' in (argocd_install.stdout | default('')) or
        'STATUS: upgraded' in (argocd_install.stdout | default(''))
      failed_when: argocd_install.rc != 0

    - name: Wait for ArgoCD pods to be Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --namespace
          - "{{ argocd_namespace }}"
          - --for=condition=Ready
          - pod
          - --all
          - "--timeout={{ argocd_wait_timeout }}s"
      register: argocd_wait
      changed_when: false

    - name: Verify ArgoCD installation
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - -n
          - "{{ argocd_namespace }}"
      register: argocd_pods_check
      changed_when: false

    - name: Assert ArgoCD verification succeeded
      ansible.builtin.assert:
        that:
          - argocd_pods_check.rc == 0
        fail_msg: "ArgoCD installation verification failed."
        success_msg: "ArgoCD installation verified successfully."

    - name: Generate ArgoCD application manifest
      ansible.builtin.template:
        src: application.yaml.j2
        dest: /tmp/application.yaml
        mode: "0644"

    - name: Apply ArgoCD application
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - /tmp/application.yaml
      register: argocd_application
      changed_when: >
        'created' in (argocd_application.stdout | default('')) or
        'configured' in (argocd_application.stdout | default(''))

    - name: Wait for ArgoCD application to be created
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - application
          - skillpulse
          - -n
          - "{{ argocd_namespace }}"
          - --for=jsonpath={.status.sync.status}=Synced
          - --timeout=300s
      changed_when: false
      failed_when: false

    - name: Verify ArgoCD application
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - application
          - skillpulse
          - -n
          - "{{ argocd_namespace }}"
      register: argocd_application_check
      changed_when: false

    - name: Assert ArgoCD application created
      ansible.builtin.assert:
        that:
          - argocd_application_check.rc == 0
        fail_msg: "ArgoCD Application creation failed."
        success_msg: "ArgoCD Application created successfully."