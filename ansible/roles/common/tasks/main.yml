---
# Prepare the base operating system with idempotent package and configuration tasks.
- name: Ensure apt cache is updated
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: Upgrade all packages to the latest compatible version
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true
  register: apt_upgrade_result
  when: ansible_os_family == 'Debian'
  notify:
    - clean apt cache

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: false
  when:
    - ansible_os_family == 'Debian'
    - common_packages | length > 0

- name: Ensure Python3 is installed
  ansible.builtin.apt:
    name: python3
    state: present
    update_cache: false
  when: ansible_os_family == 'Debian'

- name: Set the system hostname
  ansible.builtin.hostname:
    name: "{{ common_hostname }}"
  when:
    - common_hostname is defined
    - common_hostname | length > 0

- name: Configure the system timezone
  community.general.timezone:
    name: "{{ common_timezone }}"
  when:
    - common_timezone is defined
    - common_timezone | length > 0

- name: Check if a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file
  changed_when: reboot_required_file.stat.exists | bool
  notify:
    - reboot host
